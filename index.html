<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Xerox — Print Studio</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  body {
    font-family: 'Inter', sans-serif;
    background: linear-gradient(135deg, #faf5ff 0%, #ffffff 40%, #fdf2f8 100%);
    min-height: 100vh;
  }
  .glass {
    background: rgba(255,255,255,0.75);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(216,180,254,0.45);
  }
  .grad-text {
    background: linear-gradient(90deg, #9333ea, #ec4899);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .grad-btn {
    background: linear-gradient(90deg, #9333ea, #ec4899);
    transition: all .25s ease;
  }
  .grad-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 30px -8px rgba(236,72,153,.5);
  }
  .shadow-soft { box-shadow: 0 10px 40px -10px rgba(168,85,247,.25); }
  .fade-up { animation: fadeUp .45s ease-out; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body class="flex items-center justify-center px-4 py-12">

<div class="w-full max-w-lg fade-up">

  <div class="text-center mb-10">
    <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full glass text-sm font-medium text-purple-700 mb-6">
      <span class="w-2 h-2 rounded-full bg-pink-500 animate-pulse"></span>
      Print Studio
    </div>
    <h1 class="text-5xl font-bold tracking-tight mb-3">
      Print in <span class="grad-text">seconds.</span>
    </h1>
    <p class="text-slate-600">Scan. Upload. Collect.</p>
  </div>

  <div class="space-y-4">
    <a href="customer/"
      class="block glass rounded-3xl p-6 hover:shadow-soft transition-all group">
      <div class="flex items-center gap-4">
        <div class="w-14 h-14 rounded-2xl grad-btn flex items-center justify-center flex-shrink-0 shadow-soft">
          <i data-lucide="smartphone" class="w-6 h-6 text-white"></i>
        </div>
        <div class="flex-1">
          <p class="font-bold text-lg text-slate-800">Customer</p>
          <p class="text-sm text-slate-500">Upload files & send to shop</p>
        </div>
        <i data-lucide="arrow-right" class="w-5 h-5 text-purple-500 group-hover:translate-x-1 transition-transform"></i>
      </div>
    </a>

    <a href="shop/"
      class="block glass rounded-3xl p-6 hover:shadow-soft transition-all group">
      <div class="flex items-center gap-4">
        <div class="w-14 h-14 rounded-2xl grad-btn flex items-center justify-center flex-shrink-0 shadow-soft">
          <i data-lucide="store" class="w-6 h-6 text-white"></i>
        </div>
        <div class="flex-1">
          <p class="font-bold text-lg text-slate-800">Shop Console</p>
          <p class="text-sm text-slate-500">Manage printers & queue</p>
        </div>
        <i data-lucide="arrow-right" class="w-5 h-5 text-purple-500 group-hover:translate-x-1 transition-transform"></i>
      </div>
    </a>
  </div>

  <p class="mt-10 text-center text-xs text-slate-400">🔒 Files auto-deleted after 12 hours</p>
</div>

<script>lucide.createIcons();</script>
</body>
</html>
